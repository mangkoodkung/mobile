<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ทดสอบการโหลดแอปเหตุการณ์คู่ขนาน</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
        background: #1a1a1a;
        color: #fff;
      }
      .test-section {
        margin: 20px 0;
        padding: 15px;
        border: 1px solid #333;
        border-radius: 8px;
        background: #2a2a2a;
      }
      .success {
        color: #4ade80;
      }
      .error {
        color: #f87171;
      }
      .warning {
        color: #fbbf24;
      }
      button {
        background: #3b82f6;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 4px;
        cursor: pointer;
        margin: 5px;
      }
      button:hover {
        background: #2563eb;
      }
      pre {
        background: #111;
        padding: 10px;
        border-radius: 4px;
        overflow-x: auto;
      }
    </style>
  </head>
  <body>
    <h1>🧪 ทดสอบการโหลดแอปเหตุการณ์คู่ขนาน</h1>

    <div class="test-section">
      <h2>1. ทดสอบการโหลดไฟล์</h2>
      <button onclick="testFileLoading()">เริ่มทดสอบการโหลดไฟล์</button>
      <div id="file-test-result"></div>
    </div>

    <div class="test-section">
      <h2>2. ตรวจสอบตัวแปรส่วนกลาง</h2>
      <button onclick="checkGlobalVariables()">ตรวจสอบตัวแปรส่วนกลาง</button>
      <div id="global-vars-result"></div>
    </div>

    <div class="test-section">
      <h2>3. ทดสอบการเริ่มต้นตัวจัดการ</h2>
      <button onclick="testManagerInitialization()">ทดสอบการเริ่มต้นตัวจัดการ</button>
      <div id="manager-test-result"></div>
    </div>

    <div class="test-section">
      <h2>4. บันทึกคอนโซล</h2>
      <button onclick="clearConsole()">ล้างคอนโซล</button>
      <p>กรุณาเปิดเครื่องมือนักพัฒนาของเบราว์เซอร์เพื่อดูบันทึกโดยละเอียด</p>
    </div>

    <script>
      console.log('🧪 [Test] หน้าทดสอบแอปเหตุการณ์คู่ขนานโหลดแล้ว');

      // จำลองตัวแปรส่วนกลางที่จำเป็นบางตัว (สำหรับทดสอบ)
      window.mobileContextEditor = { test: true };
      window.mobileCustomAPIConfig = { test: true };
      window.showMobileToast = function (message, type) {
        console.log(`[Toast] ${type}: ${message}`);
      };

      async function testFileLoading() {
        const resultDiv = document.getElementById('file-test-result');
        resultDiv.innerHTML = '<p>กำลังทดสอบการโหลดไฟล์...</p>';

        const files = ['./parallel-events-styles.js', './parallel-events-app.js'];

        let results = [];

        for (const file of files) {
          try {
            const script = document.createElement('script');
            script.src = file;

            await new Promise((resolve, reject) => {
              script.onload = () => {
                results.push(`<span class="success">✅ ${file} - โหลดสำเร็จ</span>`);
                resolve();
              };
              script.onerror = () => {
                results.push(`<span class="error">❌ ${file} - โหลดล้มเหลว</span>`);
                reject();
              };
              document.head.appendChild(script);
            });
          } catch (error) {
            results.push(`<span class="error">❌ ${file} - ข้อผิดพลาด: ${error.message}</span>`);
          }
        }

        resultDiv.innerHTML = results.join('<br>');
      }

      function checkGlobalVariables() {
        const resultDiv = document.getElementById('global-vars-result');

        const vars = {
          ParallelEventsApp: window.ParallelEventsApp,
          parallelEventsManager: window.parallelEventsManager,
          parallelEventsStyles: window.parallelEventsStyles,
          getParallelEventsAppContent: window.getParallelEventsAppContent,
          bindParallelEventsAppEvents: window.bindParallelEventsAppEvents,
        };

        let results = [];
        Object.entries(vars).forEach(([name, value]) => {
          const exists = value !== undefined;
          const type = typeof value;
          const status = exists ? 'success' : 'error';
          const icon = exists ? '✅' : '❌';
          results.push(`<span class="${status}">${icon} ${name}: ${type}</span>`);
        });

        resultDiv.innerHTML = results.join('<br>');
      }

      async function testManagerInitialization() {
        const resultDiv = document.getElementById('manager-test-result');
        resultDiv.innerHTML = '<p>กำลังทดสอบการเริ่มต้นตัวจัดการ...</p>';

        try {
          if (!window.ParallelEventsApp) {
            throw new Error('ไม่พบคลาส ParallelEventsApp');
          }

          if (!window.parallelEventsManager) {
            console.log('[Test] สร้างอินสแตนซ์ตัวจัดการ...');
            window.parallelEventsManager = new window.ParallelEventsApp();
          }

          if (!window.parallelEventsManager.isInitialized) {
            console.log('[Test] เริ่มต้นตัวจัดการ...');
            await window.parallelEventsManager.initialize();
          }

          resultDiv.innerHTML = `
                    <span class="success">✅ เริ่มต้นตัวจัดการสำเร็จ</span><br>
                    <span class="success">✅ isInitialized: ${window.parallelEventsManager.isInitialized}</span><br>
                    <span class="success">✅ isListening: ${window.parallelEventsManager.isListening}</span>
                `;
        } catch (error) {
          resultDiv.innerHTML = `<span class="error">❌ เริ่มต้นตัวจัดการล้มเหลว: ${error.message}</span>`;
          console.error('[Test] เริ่มต้นตัวจัดการล้มเหลว:', error);
        }
      }

      function clearConsole() {
        console.clear();
        console.log('🧪 [Test] ล้างคอนโซลแล้ว');
      }

      // ตรวจสอบอัตโนมัติหลังโหลดหน้าเสร็จ
      window.addEventListener('load', () => {
        setTimeout(() => {
          console.log('🧪 [Test] โหลดหน้าเสร็จแล้ว เริ่มตรวจสอบอัตโนมัติ...');
          checkGlobalVariables();
        }, 1000);
      });
    </script>
  </body>
</html>
